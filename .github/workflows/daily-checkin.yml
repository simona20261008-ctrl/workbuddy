name: WorkBuddy 每日签到 + 派猫猫旅行

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00（GitHub cron 使用 UTC，且可能延迟数分钟，属正常）
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # 允许在 GitHub UI / `gh workflow run` 手动触发一次

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 仅从 Secret 读取，云端无本机登录态、无明文 token
      WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
      WB_FEISHU_WEBHOOK: ${{ secrets.WB_FEISHU_WEBHOOK }}
      WB_FEISHU_SECRET: ${{ secrets.WB_FEISHU_SECRET }}
      # 可选：配置后启用「云端自续期」，本机只需最初注入一次，之后永远关机也能跑
      WB_GH_PAT: ${{ secrets.WB_GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyNaCl (仅自续期需要)
        if: ${{ secrets.WB_GH_PAT != '' }}
        run: python3 -m pip install --quiet pynacl

      - name: Run check-in + cat travel
        run: |
          # 解释器路径不写死版本号，动态取
          PY=$(command -v python3 || command -v python)
          echo "using interpreter: $PY"
          "$PY" scripts/run_checkin.py
